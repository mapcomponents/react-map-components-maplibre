packages:
  - 'apps/**'
  - 'packages/**'

minimumReleaseAge: 1440 # minutes (24 hours)

allowBuilds:
  '@swc/core': true
  core-js: true
  cypress: true
  esbuild: true
  nx: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - cypress
  - nx
  - unrs-resolver

sideEffectsCache: false
