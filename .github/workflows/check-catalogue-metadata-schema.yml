# /* eslint-disable */
name: catalogue-meta-schema-check
on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  check-catalogue-meta-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm install -g pnpm@12.21.0 --force
      - name: Setup pnpm global bin
        run: pnpm setup
      - name: Install and build 🔧
        run: |
          pnpm ci
          npx nx run-many -t build-catalogue-meta --verbose
